<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Read & Rise</title>
  <link rel="icon" href="./image/WhatsApp Image 2025-04-04 at 00.40.00_fe0f4ca3.jpg" type="image/x-icon">
  <link rel="stylesheet" href="Style.css">
</head>
<body>

  <div class="container">
    <h1>READ <span class="span">&</span> RISE</h1>
   
    <div id="book-list">
      

    </div> 
  </div>

  
  <footer>
    <p>&copy; 2025 Read & Rise. All Rights Reserved.</p>
  </footer>

  <script>
    const books = [
      {
        title: "Atomic Habits",
        image: "./image/WhatsApp Image 2025-04-13 at 20.03.35_9901bccc.jpg",
        description: "A practical guide to building good habits and breaking bad ones, written by James Clear.",
        link: "https://amzn.to/3Yvv26V",

       
      },
      {
        title: "How to Win Friends&Influence People",
        image: "./image/WhatsApp Image 2025-04-06 at 14.42.13_de2ea956.jpg",
        description: "A timeless guide to improving communication and relationships, by Dale Carnegie.",
        link: "https://amzn.to/4cvSln3",

      },
      {
        title: "Power Robots Green",
        image: "./image/WhatsApp Image 2025-04-06 at 14.44.28_1cdbdf9b.jpg",
        description: "An exciting journey into eco-friendly robotics and how green technology is shaping the future.",
        link: "https://amzn.to/4ibDLlJ",


      }
    ];

    const bookList = document.getElementById("book-list");

    books.forEach(book => {
      const bookDiv = document.createElement("div");
      bookDiv.classList.add("book");
      bookDiv.innerHTML = `
        <img src="${book.image}" alt="${book.title}">
        <h3>${book.title}</h3>
        <p>${book.description}</p>
        <a href="${book.link}" target="_blank" rel="noopener noreferrer">
        <button>View</button>
        </a>
      `;
      bookList.appendChild(bookDiv);
    });
  </script>
</body>
</html>
